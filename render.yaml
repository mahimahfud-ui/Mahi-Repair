# Mahi Repair Admin Panel — PR preview/staging service.
# Production must be configured separately after PR review and merge.
services:
  - type: web
    name: mahi-repair-admin-preview
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/mahimahfud-ui/Mahi-Repair
    branch: security-hardening/run-repair
    buildCommand: cd admin-panel && npm ci && npm run build
    startCommand: cd admin-panel && npm start
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://shwqsljicmhflnvjqjah.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
