project_id = "shwqsljicmhflnvjqjah"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

# Local Supabase environments require re-authentication after a maximum
# session lifetime or prolonged inactivity. Hosted projects must receive the
# same settings in Dashboard -> Authentication -> Sessions separately.
[auth.sessions]
timebox = "12h"
inactivity_timeout = "8h"

[functions.admin-manage-tool-state]
verify_jwt = true

# Supabase Auth invokes this endpoint with a signed HTTP Auth Hook request.
# The function verifies the Standard Webhooks signature itself.
[functions.send-auth-email]
verify_jwt = false
