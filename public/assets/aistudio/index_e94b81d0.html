<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahi Repair — Prototype</title>
<style>
/* Tokens (mirror design-system/tokens.css) */
:root{color-scheme:dark;--bg:#060A14;--surface-1:#0D1424;--surface-2:#121B2F;--surface-3:#1A2540;--border:rgba(150,180,255,.08);--border-strong:rgba(150,180,255,.16);--t1:#F3F6FC;--t2:#9AA7C2;--t3:#5E6B88;--accent:#5B8CFF;--accent-hi:#8FB2FF;--accent-soft:rgba(91,140,255,.14);--red:#FF4D5E;--red-soft:rgba(255,77,94,.14);--ok:#4FD69C;--warn:#F2B866;--bad:#FF5A6A;--r-sm:10px;--r-md:16px;--r-lg:22px;--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.22,1,.36,1);--sans:"Inter","SF Pro Text",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono","SF Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(900px 520px at 90% -12%,rgba(255,77,94,.09),transparent 62%),radial-gradient(1100px 640px at 8% -18%,rgba(70,110,255,.18),transparent 62%),var(--bg);color:var(--t1);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:1200px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;padding:20px 20px 110px}
.screen.push{animation:push .48s var(--ease) both}
.screen.push .eyebrow,.screen.push h1{animation:rise .6s var(--spring) .06s both}
@keyframes push{from{opacity:0;transform:translate3d(28px,0,0) scale(.985)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.card{animation:none}
.screen.push .card{animation:rise .6s var(--spring) both}
.screen.push .card:nth-child(2){animation-delay:.08s}
.screen.push .card:nth-child(3){animation-delay:.14s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);font-weight:600}
.muted{color:var(--t2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:linear-gradient(180deg,var(--surface-2),var(--surface-1));border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.card.interactive{transition:transform .2s var(--ease),border-color .2s;text-align:left;width:100%}
.card.interactive:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.card.interactive:active{transform:scale(.985)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-3);color:var(--t2)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{color:var(--ok);background:rgba(95,211,154,.12)}
.badge.warn{color:var(--warn);background:rgba(233,184,114,.12)}
.badge.bad{color:var(--bad);background:rgba(240,122,122,.12)}
.badge.run{color:var(--accent);background:var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;font-weight:600;transition:transform .15s var(--ease),background .2s,opacity .2s;width:100%}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,#6A9AFF,#4A74F0);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 28px -10px rgba(70,110,255,.7)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:linear-gradient(180deg,#FF6B79,#E63C4E);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 28px -10px rgba(255,77,94,.6)}
.btn{transition:transform .35s var(--spring),filter .2s,background .3s,opacity .2s}
.btn.ghost{background:var(--surface-3);color:var(--t1);border:1px solid var(--border)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.sm{height:36px;width:auto;padding:0 14px;font-size:13px;border-radius:12px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;flex:none}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-3)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset .9s var(--ease);stroke-linecap:round}
.ring .label{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.bar{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-strong),var(--accent));border-radius:6px;transition:width .5s var(--ease)}
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shim 1.4s infinite;border-radius:10px}
@keyframes shim{to{background-position:-200% 0}}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--border)}
.li:first-child{border-top:0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv div span{display:block;font-size:12px;color:var(--t3)}
.kv div b{font-weight:600;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--surface-3);border:1px solid var(--border-strong);padding:12px 18px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.5);transition:all .3s var(--ease);pointer-events:none;font-size:14px;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--surface-1);border:1px solid var(--border-strong);border-radius:26px 26px 0 0;padding:12px 20px 28px;transform:translateY(104%);transition:transform .56s var(--ease);z-index:50;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--surface-3);margin:0 auto 16px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,17,21,.82);backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--border);padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.nav-inner{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;margin:0 auto}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--t3);padding:6px 0;transition:color .2s}
.nav button.on{color:var(--t1)}
.nav button.on svg{stroke:var(--accent)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:14px;position:relative;padding-bottom:18px}
.step:not(:last-child)::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--surface-3)}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-3);color:var(--t3);flex:none;transition:all .3s}
.step.done .n{background:var(--ok);color:#06210f}
.step.active .n{background:var(--accent);color:#06222d;box-shadow:0 0 0 5px var(--accent-soft)}
.step.done::before,.step.active::before{background:var(--ok)!important}
.step.active .t{color:var(--t1)}
.step .t{color:var(--t2);font-weight:500}
.step .s{font-size:13px;color:var(--t3)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:4px}
.seg button{flex:1;height:36px;border-radius:10px;color:var(--t2);font-size:14px;font-weight:500;transition:all .2s var(--ease)}
.seg button.on{background:var(--surface-3);color:var(--t1);box-shadow:var(--shadow-1)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--t2)}
.field input{height:48px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--t1);padding:0 14px;font:inherit;transition:border-color .2s,box-shadow .2s}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field .err{font-size:12px;color:var(--bad);min-height:16px}
.field.invalid input{border-color:var(--bad)}
.empty{text-align:center;padding:40px 16px;color:var(--t2)}
.empty .orb{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;color:var(--t3)}
.check{width:72px;height:72px;border-radius:50%;background:rgba(95,211,154,.12);display:grid;place-items:center;margin:8px auto 16px;color:var(--ok)}
.check svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s .1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--border);margin-top:18px}
.tabs button{padding:10px 0;color:var(--t3);font-weight:500;position:relative}
.tabs button.on{color:var(--t1)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.sec{margin-top:28px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sec-h a{font-size:13px;color:var(--accent);cursor:pointer}
.hero{position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(125,211,240,.18),transparent 70%);pointer-events:none}
.phone{width:54px;height:96px;border-radius:14px;border:2px solid var(--border-strong);background:var(--bg);display:grid;place-items:center;position:relative;flex:none}
.phone::after{content:"";position:absolute;top:6px;width:14px;height:3px;border-radius:3px;background:var(--surface-3)}
.pulse{position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(95,211,154,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(95,211,154,0)}100%{box-shadow:0 0 0 0 rgba(95,211,154,0)}}
.tools{grid-template-columns:1fr}
@media (min-width:640px){.tools{grid-template-columns:1fr 1fr}.screen{padding:28px 32px 120px}}
@media (min-width:1024px){
  .app{display:grid;grid-template-columns:232px 1fr;max-width:1280px}
  .nav{position:sticky;top:0;bottom:auto;height:100vh;left:auto;right:auto;border-top:0;border-right:1px solid var(--border);padding:28px 16px;background:var(--bg-side,#0D1014);backdrop-filter:none;display:flex;flex-direction:column;gap:6px;align-self:start}
  .nav-inner{display:flex;flex-direction:column;gap:4px;max-width:none}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:11px 12px;border-radius:12px}
  .nav button.on{background:var(--surface-2)}
  .screen{padding:36px 44px 60px}
  .desk-2{grid-template-columns:1.4fr 1fr}
  .desk-3{grid-template-columns:repeat(3,1fr)}
  .tools{grid-template-columns:repeat(3,1fr)}
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 24px;font-weight:650;letter-spacing:-.01em}
.brand .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,#5B8CFF 10%,#FF4D5E 115%);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;box-shadow:0 6px 18px -6px rgba(91,140,255,.6)}
.hero::after{background:radial-gradient(circle,rgba(91,140,255,.22),rgba(255,77,94,.08) 50%,transparent 70%)!important}
.progress-red > i{background:linear-gradient(90deg,#FF4D5E,#FF8A6B)}
.proto-note{font-size:11px;color:var(--t3);margin-top:28px;padding:0 8px}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="nav" id="nav"></aside>
  <main id="main" style="min-width:0"></main>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Mock data (prototype only; never connected to real devices or APIs) ---------- */
const DEVICE = {name:"Pixel 8", model:"Sample device", android:"Android 15", battery:82, storage:61, internet:"Connected · Wi-Fi", connected:true, id:"DEMO-0001"};
const TOOLS = [
  {id:"yt",  name:"YouTube Quick Repair",     short:"YT",  desc:"Clears cache, checks network and reopens the app.", steps:["Verify internet","Check app installed","Open app details","Ask confirmation","Open app"]},
  {id:"fb",  name:"Facebook Troubleshooter",  short:"FB",  desc:"Checks connectivity and guides a clean reinstall.", steps:["Verify internet","Probe HTTPS","Check app installed","Show guide"]},
  {id:"dns", name:"DNS Repair & Diagnostics", short:"DNS", desc:"Looks up resolvers and verifies name resolution.", steps:["DNS lookup","Verify DNS","Verify internet"]},
  {id:"wifi",name:"Wi-Fi Troubleshooter",     short:"Wi",  desc:"Walks through signal, network and router checks.", steps:["Check internet","Show guide","Open Android settings"]},
  {id:"play",name:"Play Store Repair",        short:"PS",  desc:"Checks storage and opens store settings for recovery.", steps:["Check storage","Open app details","Request own-app permission"]}
];
const HISTORY = [
  {tool:"DNS Repair & Diagnostics", when:"Today, 09:14", result:"ok",   label:"Verified"},
  {tool:"YouTube Quick Repair",     when:"Yesterday",    result:"ok",   label:"Completed"},
  {tool:"Wi-Fi Troubleshooter",     when:"Mon, 18:40",   result:"warn", label:"Needs attention"},
  {tool:"Play Store Repair",        when:"Sun, 11:02",   result:"bad",  label:"Failed"}
];
const LOGS = {
  ok:["[09:14:02] CHECK_INTERNET ........ OK","[09:14:03] DNS_LOOKUP ............ OK","[09:14:04] VERIFY_DNS .............. OK","Verdict: healthy"],
  warn:["[18:40:11] CHECK_INTERNET ........ OK","[18:40:12] SHOW_GUIDE ............. OK","[18:40:12] Verdict: user action required"],
  bad:["[11:02:20] CHECK_STORAGE .......... OK","[11:02:21] REQUEST_OWN_APP_PERMISSION . DENIED","Verdict: failed — permission not granted"]
};

/* ---------- State ---------- */
const S = {tab:"home", toolId:null, phase:"idle", sheet:null, histFilter:"all", settings:{reduceMotion:false, notify:true}};
const $ = s => document.querySelector(s);
const ICON = {
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  tools:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
  hist:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  set:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.7a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.7a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>'
};
const TABS = [["home","Home",ICON.home],["tools","Tools",ICON.tools],["hist","History",ICON.hist],["set","Settings",ICON.set]];
const toolById = id => TOOLS.find(t=>t.id===id);

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200)}
function openSheet(html){$("#sheet").innerHTML='<div class="grab"></div>'+html;$("#sheet").classList.add("show");$("#scrim").classList.add("show")}
function closeSheet(){$("#sheet").classList.remove("show");$("#scrim").classList.remove("show")}
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* ---------- Nav ---------- */
function renderNav(){
  $("#nav").innerHTML = `<div class="brand"><div class="mk">M</div>Mahi Repair</div>` +
  `<div class="nav-inner">` + TABS.map(([k,l,ic])=>`<button class="${S.tab===k?'on':''}" data-tab="${k}" aria-current="${S.tab===k}">${ic}<span>${l}</span></button>`).join("") + `</div>`;
  $("#nav").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.phase="idle";render()});
  // Mobile bottom nav is the same element styled as fixed bar via CSS
}

/* ---------- Screens ---------- */
function home(){
  const ringOff = 2*Math.PI*54*(1-DEVICE.battery/100);
  return `
  <div class="eyebrow">Good morning</div>
  <h1 style="margin-top:4px">Your device is ready</h1>
  <div class="grid desk-2" style="margin-top:22px">
    <section class="card hero">
      <div class="row" style="gap:20px;align-items:center">
        <div class="phone"><span class="pulse"></span></div>
        <div style="flex:1;min-width:0">
          <div class="row between"><span class="badge ok"><span class="dot"></span>Connected</span><span class="mono muted" style="font-size:12px">${DEVICE.id}</span></div>
          <div style="font-size:22px;font-weight:650;margin-top:10px;letter-spacing:-.01em">${DEVICE.name}</div>
          <div class="muted" style="font-size:13px">${DEVICE.android} · ${DEVICE.internet}</div>
        </div>
      </div>
      <div class="kv" style="margin-top:22px">
        <div><span>Battery</span><b class="mono">${DEVICE.battery}%</b><div class="bar" style="margin-top:6px"><i style="width:${DEVICE.battery}%"></i></div></div>
        <div><span>Storage used</span><b class="mono">${DEVICE.storage}%</b><div class="bar" style="margin-top:6px"><i style="width:${DEVICE.storage}%"></i></div></div>
      </div>
    </section>
    <section class="card" style="display:flex;flex-direction:column;justify-content:space-between;gap:18px">
      <div>
        <div class="eyebrow">Recommended</div>
        <h2 style="margin-top:6px;font-size:19px">Run a connection check</h2>
        <p class="muted" style="font-size:14px;margin-top:6px">Verifies internet and DNS before you troubleshoot an app.</p>
      </div>
      <button class="btn primary" data-open="dns">Start DNS diagnostics</button>
    </section>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Repair tools</h2><a data-tab-go="tools">View all</a></div>
    <div class="grid tools">${TOOLS.slice(0,3).map(toolCard).join("")}</div>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Recent activity</h2><a data-tab-go="hist">History</a></div>
    <div class="card list" style="padding:6px 18px">${HISTORY.slice(0,3).map(histRow).join("")}</div>
  </div>
  <p class="proto-note">Prototype · sample data · no device or network is accessed.</p>`;
}
function toolCard(t){return `<button class="card interactive" data-open="${t.id}">
  <div class="row"><div class="ico">${t.short}</div><div style="flex:1;min-width:0"><div style="font-weight:600">${t.name}</div><div class="muted" style="font-size:13px;margin-top:2px">${t.steps.length} steps</div></div><span class="muted">›</span></div>
  <p class="muted" style="font-size:14px;margin-top:14px">${t.desc}</p></button>`}
function histRow(h){return `<div class="li"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">${h.tool}</div><div class="muted" style="font-size:12px">${h.when}</div></div><span class="badge ${h.result}"><span class="dot"></span>${h.label}</span></div>`}

function tools(){return `
  <div class="eyebrow">Library</div>
  <h1 style="margin-top:4px">Repair tools</h1>
  <p class="muted" style="margin-top:6px">Verified, step-by-step tools. Every action asks for your confirmation.</p>
  <div class="grid tools" style="margin-top:22px">${TOOLS.map(toolCard).join("")}</div>`}

function toolDetail(){
  const t = toolById(S.toolId); if(!t) return tools();
  const p = S.phase;
  const stepsHtml = t.steps.map((s,i)=>{
    const st = p==="done"?"done":(p==="running"&&i<S.step?"done":(p==="running"&&i===S.step?"active":""));
    return `<div class="step ${st}"><div class="n">${st==="done"?"✓":i+1}</div><div><div class="t">${s}</div><div class="s">${st==="done"?"Completed":st==="active"?"In progress…":"Pending"}</div></div></div>`}).join("");
  const action = p==="idle" ? `<button class="btn primary" data-run="${t.id}">Start prototype run</button>`
              : p==="running" ? `<button class="btn ghost" disabled>Running…</button>`
              : `<button class="btn ghost" data-reset>Run again</button>`;
  return `
  <button class="muted" data-tab-go="tools" style="margin-bottom:14px">‹ Tools</button>
  <div class="row" style="gap:16px"><div class="ico" style="width:52px;height:52px;font-size:16px">${t.short}</div><div><div class="eyebrow">Repair tool</div><h1 style="font-size:24px;margin-top:2px">${t.name}</h1></div></div>
  <div class="grid desk-2" style="margin-top:22px">
    <section class="card">
      <h2>Overview</h2><p class="muted" style="margin-top:6px">${t.desc}</p>
      <div style="margin-top:20px"><div class="eyebrow" style="margin-bottom:12px">Steps</div><div class="steps">${stepsHtml}</div></div>
    </section>
    <section class="card" style="display:flex;flex-direction:column;gap:16px">
      <div class="row between"><h2>Status</h2>${statusBadge(p)}</div>
      ${p==="done" ? resultBlock(t) : p==="running" ? `<div class="bar"><i style="width:${Math.round(((S.step||0)/t.steps.length)*100)}%"></i></div><p class="muted" style="font-size:14px">Executing allowlisted action ${(S.step||0)+1} of ${t.steps.length}.</p>` : `<p class="muted" style="font-size:14px">Ready. Nothing runs until you confirm each step.</p>`}
      <div style="margin-top:auto">${action}</div>
    </section>
  </div>`;
}
function statusBadge(p){return p==="running"?'<span class="badge run"><span class="dot"></span>Running</span>':p==="done"?'<span class="badge ok"><span class="dot"></span>Complete</span>':'<span class="badge"><span class="dot"></span>Idle</span>'}
function resultBlock(t){return `<div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <div style="text-align:center"><div style="font-weight:650;font-size:18px">Simulated run complete</div><p class="muted" style="font-size:14px;margin-top:4px">Demonstration only. No real repair was executed.</p></div>
  <div class="card" style="background:var(--surface-1);padding:14px"><div class="mono muted" style="font-size:12px;line-height:1.8">${LOGS.ok.join("<br>")}</div></div>`}

function historyScreen(){
  const f = S.histFilter;
  const rows = HISTORY.filter(h=>f==="all"||h.result===f);
  return `
  <div class="eyebrow">Audit</div><h1 style="margin-top:4px">History</h1>
  <div class="row" style="margin-top:20px"><div class="seg" style="width:100%;max-width:440px">
    ${[["all","All"],["ok","Passed"],["warn","Attention"],["bad","Failed"]].map(([k,l])=>`<button class="${f===k?'on':''}" data-filter="${k}">${l}</button>`).join("")}
  </div></div>
  <div class="sec">${rows.length? `<div class="card list" style="padding:6px 18px">${rows.map(histRow).join("")}</div>`
    : `<div class="card empty"><div class="orb">○</div><h2>Nothing here yet</h2><p style="margin-top:6px;font-size:14px">Runs you complete will appear in this log.</p></div>`}</div>
  <div class="sec"><div class="sec-h"><h2>Latest log</h2></div><div class="card"><div class="mono muted" style="font-size:12px;line-height:1.8">${LOGS.warn.join("<br>")}</div></div></div>`;
}

function settingsScreen(){
  const s=S.settings;
  return `
  <div class="eyebrow">Preferences</div><h1 style="margin-top:4px">Settings</h1>
  <div class="sec card list" style="padding:6px 18px">
    <div class="li"><div style="flex:1"><div style="font-weight:600">Notifications</div><div class="muted" style="font-size:13px">Alerts when a run needs your attention</div></div>
      <button class="btn sm ${s.notify?'primary':'ghost'}" data-toggle="notify">${s.notify?'On':'Off'}</button></div>
    <div class="li"><div style="flex:1"><div style="font-weight:600">Reduce motion</div><div class="muted" style="font-size:13px">Limits transitions to essential feedback</div></div>
      <button class="btn sm ${s.reduceMotion?'primary':'ghost'}" data-toggle="reduceMotion">${s.reduceMotion?'On':'Off'}</button></div>
    <div class="li"><div style="flex:1"><div style="font-weight:600">Offline emergency mode</div><div class="muted" style="font-size:13px">Show cached guides when there is no connection</div></div><span class="badge ok"><span class="dot"></span>Ready</span></div>
  </div>
  <div class="sec"><div class="sec-h"><h2>Account</h2></div>
    <div class="card"><form id="signin" novalidate>
      <div class="field" id="fEmail"><label for="em">Invited email</label><input id="em" type="email" placeholder="name@example.com" autocomplete="email"><div class="err"></div></div>
      <div style="height:14px"></div>
      <button class="btn primary" type="submit">Send one-time code</button>
    </form></div>
  </div>
  <p class="proto-note">Sign-in is demonstration validation only. No email is sent.</p>`;
}

/* ---------- Render ---------- */
function render(){
  renderNav();
  const map={home,tools,hist:historyScreen,set:settingsScreen};
  const key = S.tab + (S.toolId||'');
  const navChanged = key !== S.lastKey; S.lastKey = key;
  $("#main").innerHTML = `<div class="screen${navChanged?' push':''}">` + (S.tab==="tool"?toolDetail():map[S.tab]()) + `</div>`;
  bind();
}
function bind(){
  document.querySelectorAll("[data-tab-go]").forEach(el=>el.onclick=()=>{S.tab=el.dataset.tabGo;S.phase="idle";render()});
  document.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{S.toolId=el.dataset.open;S.phase="idle";S.step=0;S.tab="tool";render();window.scrollTo(0,0)});
  document.querySelectorAll("[data-filter]").forEach(el=>el.onclick=()=>{S.histFilter=el.dataset.filter;render()});
  document.querySelectorAll("[data-toggle]").forEach(el=>el.onclick=()=>{const k=el.dataset.toggle;S.settings[k]=!S.settings[k];render()});
  document.querySelectorAll("[data-reset]").forEach(el=>el.onclick=()=>{S.phase="idle";S.step=0;render()});
  document.querySelectorAll("[data-run]").forEach(el=>el.onclick=()=>confirmRun(el.dataset.run));
  const f=$("#signin"); if(f) f.onsubmit=e=>{e.preventDefault();const v=$("#em").value.trim();const ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);const box=$("#fEmail");box.classList.toggle("invalid",!ok);box.querySelector(".err").textContent=ok?"":"Enter a valid email address.";if(ok)toast("Demo: a code would be sent here")};
}

/* Confirmation sheet -> simulated run */
function confirmRun(id){
  const t=toolById(id);
  openSheet(`<h2 id="sheetTitle">Run ${t.name}?</h2>
    <p class="muted" style="margin-top:8px;font-size:14px">This prototype simulates ${t.steps.length} steps. Nothing on a real device will change.</p>
    <div style="display:grid;gap:10px;margin-top:22px"><button class="btn primary" id="cYes">Confirm simulated run</button><button class="btn ghost" id="cNo">Cancel</button></div>`);
  $("#cNo").onclick=closeSheet;
  $("#cYes").onclick=()=>{closeSheet();S.toolId=id;S.tab="tool";S.phase="running";S.step=0;render();simulate(t)};
}
function simulate(t){
  let i=0;
  const tick=()=>{
    if(S.phase!=="running") return;
    S.step=i;
    if(i>=t.steps.length){S.phase="done";S.step=t.steps.length;render();toast("Simulated run complete");return}
    render(); i++; setTimeout(tick, 900);
  };
  tick();
}

// Responsive: phone uses bottom nav, desktop uses sidebar. Bottom nav container is #nav on mobile.
function mobileNavFix(){
  const nav=$("#nav");
  if(window.innerWidth<1024){nav.style.cssText="position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;border-right:0;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(14,17,21,.82);backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--border);display:block"}
  else{nav.style.cssText=""}
}
window.addEventListener("resize",mobileNavFix);
const _render=render; render=function(){_render();mobileNavFix()};
render();
</script>
</body>
</html>
