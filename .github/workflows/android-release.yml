name: Android Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify existing upload key and build signed APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Validate and install existing upload keystore
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Release signing is not configured::$name is missing. Configure the existing app upload keystore secrets in GitHub Actions."
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/mahi-existing-upload-key.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          # The current Android Gradle release configuration uses the existing
          # upload alias "upload". Never create or substitute a different key.
          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_UPLOAD_STORE_PASSWORD" \
            -alias upload >/dev/null

          {
            echo "KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "STORE_PASSWORD=$ANDROID_UPLOAD_STORE_PASSWORD"
            echo "KEY_PASSWORD=$ANDROID_UPLOAD_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run unit tests and build signed release outputs
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease bundleRelease

      - name: Upload signed release APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: mahi-repair-production-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
