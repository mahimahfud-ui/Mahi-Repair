name: Android Production Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Type PUBLISH to create a permanent GitHub Release from the signed main-branch build"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify existing upload key and build signed APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Confirm release request and source branch
        shell: bash
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production APK releases can only be built from main."
            exit 1
          fi
          if [[ "$CONFIRM_RELEASE" != "PUBLISH" ]]; then
            echo "::error::Type PUBLISH in the release confirmation field."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Validate and install existing upload keystore
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Release signing is not configured::$name is missing. Configure the existing app upload keystore secrets in GitHub Actions."
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/mahi-existing-upload-key.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          # The current Android Gradle release configuration uses the existing
          # upload alias "upload". Never create or substitute a different key.
          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_UPLOAD_STORE_PASSWORD" \
            -alias upload >/dev/null

          {
            echo "KEYSTORE_PATH=$KEYSTORE_PATH"
          } >> "$GITHUB_ENV"

      - name: Run unit tests and build signed release outputs
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease bundleRelease

      - name: Upload signed release APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: mahi-repair-production-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK and AAB as a permanent GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          APK_FILE="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          AAB_FILE="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"

          if [[ -z "$APK_FILE" || ! -f "$APK_FILE" ]]; then
            echo "::error::Signed release APK was not produced."
            exit 1
          fi
          if [[ -z "$AAB_FILE" || ! -f "$AAB_FILE" ]]; then
            echo "::error::Signed release AAB was not produced."
            exit 1
          fi

          TAG="android-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          CHECKSUM_FILE="$RUNNER_TEMP/SHA256SUMS.txt"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          sha256sum "$APK_FILE" "$AAB_FILE" | awk '{ name=$2; sub(/^.*\\//, "", name); print $1 "  " name }' > "$CHECKSUM_FILE"

          cat > "$NOTES_FILE" <<EOF
          Mahi Repair Android production build.

          - Source commit: $GITHUB_SHA
          - Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Signing: built with the existing configured Android upload keystore.
          - Assets: signed APK, Android App Bundle (AAB), and SHA-256 checksums.

          Install the APK directly on a compatible Android device. The AAB is for supported app-store distribution workflows.
          EOF

          gh release create "$TAG" "$APK_FILE" "$AAB_FILE" "$CHECKSUM_FILE" \
            --title "Mahi Repair Android build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA"

          {
            echo "## Permanent GitHub Release"
            echo
            echo "- Tag: $TAG"
            echo "- APK/AAB: [Download release assets]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)"
            echo "- SHA-256 checksums are attached as SHA256SUMS.txt."
          } >> "$GITHUB_STEP_SUMMARY"
