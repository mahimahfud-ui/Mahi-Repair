name: Android CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        id: android-sdk
        run: |
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Create an ephemeral debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Run Android unit tests and assemble debug APK
        id: gradle-build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mahi-repair-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android CI result
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          BUILD_RESULT: ${{ steps.gradle-build.outcome }}
          SDK_RESULT: ${{ steps.android-sdk.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Android CI"
            echo ""
            echo "- **Overall:** ${JOB_RESULT}"
            echo "- **SDK installation:** ${SDK_RESULT}"
            echo "- **Gradle tests + APK build:** ${BUILD_RESULT}"
            echo "- **Commit:** ${COMMIT_SHA}"
            echo "- **Run:** [Open full logs]($RUN_URL)"
            echo ""
            if [ "${JOB_RESULT}" = "success" ]; then
              echo "The Android debug APK is attached to this run as artifact mahi-repair-debug-apk."
            else
              echo "The build did not complete successfully. Open the run logs and download artifact android-unit-test-reports when available."
              echo "::error title=Android CI failed::Check this run's failed step and Android unit-test report artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
