name: Android CI

on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".env.example"
      - "scripts/ci/verify_android_backup.py"
      - "scripts/ci/secret_scan.py"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches:
      - main
      - security-hardening/run-repair
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".env.example"
      - "scripts/ci/verify_android_backup.py"
      - "scripts/ci/secret_scan.py"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android unit, Compose UI tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"
      - name: Configure Gradle from the checked-in wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-cleanup: on-success
      - name: Validate Android backup and restore exclusions
        run: python3 scripts/ci/verify_android_backup.py
      - name: Scan tracked source for privileged credentials
        run: python3 scripts/ci/secret_scan.py --source
      # This key is short-lived, conventional Android DEBUG signing material only.
      # It is never used for a release build and is not uploaded as an artifact.
      - name: Prepare an ephemeral Android debug-only keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
      - name: Run Android unit tests
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Assemble Android debug APK
        id: debug-build
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Run Compose UI tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          # These screen-only Compose tests do not need Google Play services.
          # The lighter AOSP image avoids unrelated GMS background startup work
          # that repeatedly starved/killed the instrumentation process on CI.
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          emulator-boot-timeout: 1200
          disable-animations: true
          disable-spellchecker: true
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Inspect generated debug APK for privileged credentials
        if: always() && steps.debug-build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          python3 scripts/ci/secret_scan.py --apk "$apk"
      - name: Upload Android Compose UI test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-compose-ui-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Android debug APK (not a production release)
        if: success() && steps.debug-build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mahi-repair-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android CI result
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          BUILD_RESULT: ${{ steps.debug-build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo "## Android CI"
            echo ""
            echo "- **Overall:** ${JOB_RESULT}"
            echo "- **Debug APK build:** ${BUILD_RESULT}"
            echo "- **Commit:** ${COMMIT_SHA}"
            echo "- **Run:** [Open full logs](${RUN_URL})"
            echo ""
            if [ "${JOB_RESULT}" = "success" ]; then
              echo "The attached APK is a debug artifact only; it is not a production release."
            else
              echo "One or more Android checks failed. Review the unit/Compose reports and failed step."
              echo "::error title=Android CI failed::Review this run's failing Android test or build step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
