name: Android CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        id: android-sdk
        run: |
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Create an ephemeral debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Verify Android app data backup and transfer are disabled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ANDROID_NS = "{http://schemas.android.com/apk/res/android}"
          required_domains = {
              "root", "file", "database", "sharedpref", "external",
              "device_root", "device_file", "device_database", "device_sharedpref",
          }

          manifest = ET.parse("app/src/main/AndroidManifest.xml").getroot()
          application = manifest.find("application")
          assert application is not None, "Android application element is missing"
          assert application.get(ANDROID_NS + "allowBackup") == "false", (
              "android:allowBackup must remain false because app storage contains credentials/device identity"
          )

          legacy = ET.parse("app/src/main/res/xml/backup_rules.xml").getroot()
          assert legacy.tag == "full-backup-content", "Legacy backup rules root is invalid"
          legacy_excludes = {
              (item.get("domain"), item.get("path"))
              for item in legacy.findall("exclude")
          }
          assert {(domain, ".") for domain in required_domains}.issubset(legacy_excludes), (
              "Legacy cloud/device backup exclusions are incomplete"
          )

          modern = ET.parse("app/src/main/res/xml/data_extraction_rules.xml").getroot()
          assert modern.tag == "data-extraction-rules", "Modern data extraction rules root is invalid"
          for section_name in ("cloud-backup", "device-transfer"):
              section = modern.find(section_name)
              assert section is not None, f"{section_name} rules are required"
              excludes = {
                  (item.get("domain"), item.get("path"))
                  for item in section.findall("exclude")
              }
              assert {(domain, ".") for domain in required_domains}.issubset(excludes), (
                  f"{section_name} exclusions are incomplete"
              )

          print("PASS: cloud backup and device-to-device transfer are disabled for all app-private domains.")
          PY

      - name: Run Android unit tests and assemble debug APK
        id: gradle-build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Enable KVM access for the Android emulator
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::This runner does not expose the KVM device required for accelerated Android emulation."
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run Compose UI tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Scan Android source for embedded privileged secrets
        run: |
          if grep -RInE -- '-----BEGIN (RSA )?PRIVATE KEY-----|OWNER_PRIVATE_KEY_PKCS8|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=' app/src; then
            echo "::error::Privileged key material detected in Android source."
            exit 1
          fi

      - name: Inspect debug APK for private signing keys and service-role credentials
        run: |
          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unpacked="$(mktemp -d)"
          unzip -q "$apk" -d "$unpacked"
          if grep -RIlE -- '-----BEGIN (RSA )?PRIVATE KEY-----|OWNER_PRIVATE_KEY_PKCS8|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=' "$unpacked"; then
            echo "::error::Privileged key material detected in the generated APK."
            exit 1
          fi
          echo "No private signing key or service-role credential markers found in the debug APK."

      - name: Upload Android Compose UI test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-compose-ui-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mahi-repair-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android CI result
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          BUILD_RESULT: ${{ steps.gradle-build.outcome }}
          SDK_RESULT: ${{ steps.android-sdk.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Android CI"
            echo ""
            echo "- **Overall:** ${JOB_RESULT}"
            echo "- **SDK installation:** ${SDK_RESULT}"
            echo "- **Gradle tests + APK build:** ${BUILD_RESULT}"
            echo "- **Commit:** ${COMMIT_SHA}"
            echo "- **Run:** [Open full logs](${RUN_URL})"
            echo ""
            if [ "${JOB_RESULT}" = "success" ]; then
              echo "The Android debug APK is attached to this run as artifact mahi-repair-debug-apk."
            else
              echo "The build did not complete successfully. Open the run logs and download artifact android-unit-test-reports when available."
              echo "::error title=Android CI failed::Check this run's failed step and Android unit-test report artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
