name: Import Mahi Repair Cloud admin panel

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/part-*"

permissions:
  contents: write

concurrency:
  group: mahi-repair-cloud-import
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract admin panel source
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/part-01
          cat .bootstrap/part-* | base64 --decode > /tmp/mahi-repair-cloud.tar.xz
          mkdir -p admin-panel
          tar -xJf /tmp/mahi-repair-cloud.tar.xz --strip-components=1 -C admin-panel
          test -f admin-panel/package.json
          test -f admin-panel/README.md
          test -f admin-panel/supabase/migrations/202611050001_initial_schema.sql
          test -f admin-panel/src/app/layout.tsx
          rm -rf .bootstrap
          rm -f .github/workflows/import-admin-panel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A admin-panel .bootstrap .github/workflows/import-admin-panel.yml
          git commit -m "feat: add Mahi Repair Cloud owner admin panel"
          git push origin HEAD:main
