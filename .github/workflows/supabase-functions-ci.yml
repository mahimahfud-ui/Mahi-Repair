name: Supabase Edge Functions CI

on:
  push:
    paths:
      - "admin-panel/supabase/functions/**"
      - "admin-panel/supabase/migrations/**"
      - "admin-panel/supabase/config.toml"
      - "contract-tests/**"
      - "scripts/ci/**"
      - ".github/workflows/supabase-functions-ci.yml"
      - ".github/workflows/supabase-functions-deploy.yml"
  pull_request:
    branches:
      - main
      - security-hardening/run-repair
    paths:
      - "admin-panel/supabase/functions/**"
      - "admin-panel/supabase/migrations/**"
      - "admin-panel/supabase/config.toml"
      - "contract-tests/**"
      - "scripts/ci/**"
      - ".github/workflows/supabase-functions-ci.yml"
      - ".github/workflows/supabase-functions-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Edge Function, contract and migration integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify Supabase function/migration inventory and deployment gates
        run: python3 scripts/ci/verify_supabase.py
      - name: Scan source for privileged credentials
        run: python3 scripts/ci/secret_scan.py --source
      - name: Set up Deno 2
        uses: denoland/setup-deno@909cc5acb0fdd60627fb858598759246509fa755 # v2.0.2
        with:
          deno-version: 2.x
          cache: true
          cache-hash: ${{ hashFiles('admin-panel/supabase/functions/**/*.ts', 'admin-panel/supabase/config.toml', 'contract-tests/**') }}
      - name: Discover all 15 Edge Function entrypoints
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t functions < <(find admin-panel/supabase/functions -mindepth 2 -maxdepth 2 -type f -name index.ts | sort)
          test "${#functions[@]}" -eq 15
          printf 'Validated %s Edge Function entrypoints.\n' "${#functions[@]}"
          printf '%s\n' "${functions[@]}"
      - name: Deno type-check all Edge Function entrypoints
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t functions < <(find admin-panel/supabase/functions -mindepth 2 -maxdepth 2 -type f -name index.ts | sort)
          deno check "${functions[@]}"
      - name: Type-check shared Edge Function modules and contract tests
        run: |
          deno check \
            admin-panel/supabase/functions/_shared/http.ts \
            admin-panel/supabase/functions/_shared/recipe.ts \
            admin-panel/supabase/functions/_shared/sign.ts \
            admin-panel/supabase/functions/_shared/run-report.ts \
            admin-panel/supabase/functions/_shared/recipe_test.ts \
            admin-panel/supabase/functions/_shared/run_report_test.ts
      - name: Run all Edge Function contract tests, including run-report tests
        run: deno test --allow-read=contract-tests admin-panel/supabase/functions
