name: Supabase Edge Functions CI

on:
  push:
    paths:
      - "admin-panel/supabase/functions/**"
      - ".github/workflows/supabase-functions-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "admin-panel/supabase/functions/**"
      - ".github/workflows/supabase-functions-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
    group: supabase-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Deno type-check all Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
          cache-hash: ${{ hashFiles('admin-panel/supabase/functions/**/deno.json', 'admin-panel/supabase/functions/**/*.ts') }}

      - name: Verify function source inventory
        shell: bash
        run: |
          count="$(find admin-panel/supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -type f | wc -l)"
          echo "Found ${count} Edge Function entrypoints."
          test "${count}" -eq 15

      - name: Type-check every Edge Function entrypoint
        shell: bash
        run: |
          mapfile -t functions < <(find admin-panel/supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -type f | sort)
          deno check "${functions[@]}"

      - name: Type-check shared Edge Function modules and contract tests
        run: deno check admin-panel/supabase/functions/_shared/http.ts admin-panel/supabase/functions/_shared/recipe.ts admin-panel/supabase/functions/_shared/sign.ts admin-panel/supabase/functions/_shared/run-report.ts admin-panel/supabase/functions/_shared/recipe_test.ts admin-panel/supabase/functions/_shared/run_report_test.ts

      - name: Run canonical Run Repair contract test
        run: deno test --allow-read=contract-tests admin-panel/supabase/functions/_shared/recipe_test.ts admin-panel/supabase/functions/_shared/run_report_test.ts
