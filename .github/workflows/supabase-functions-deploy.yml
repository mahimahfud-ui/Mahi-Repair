name: Deploy Supabase Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to apply pending migrations and update the live Mahi-Repair Supabase project"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply reviewed migrations and deploy protected Edge Functions
    if: github.ref == 'refs/heads/main' && inputs.confirm_production == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: supabase-production
      url: https://supabase.com/dashboard/project/shwqsljicmhflnvjqjah/functions
    env:
      PROJECT_REF: shwqsljicmhflnvjqjah
    defaults:
      run:
        working-directory: admin-panel

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Supabase CLI v2.122.1
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: 2.122.1

      - name: Validate protected deployment configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Add SUPABASE_ACCESS_TOKEN to the supabase-production GitHub environment."
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "::error::Add SUPABASE_DB_PASSWORD to the supabase-production GitHub environment."
            exit 1
          }
          test -n "$ADMIN_ORIGIN" || {
            echo "::error::Set ADMIN_ORIGIN to the exact HTTPS Admin Panel origin."
            exit 1
          }
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ["ADMIN_ORIGIN"]
          parsed = urlparse(value)
          if (
              parsed.scheme != "https"
              or not parsed.netloc
              or parsed.path != ""
              or parsed.query
              or parsed.fragment
              or value != f"https://{parsed.netloc}"
              or "@" in parsed.netloc
          ):
              raise SystemExit(
                  "ADMIN_ORIGIN must be the exact canonical HTTPS origin "
                  "(scheme + host + optional port only; no trailing slash, path, query or fragment)."
              )
          PY
          python3 ../scripts/ci/verify_supabase.py

      - name: Link the production Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Verify signing private key already exists in Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          secret_names="$(supabase secrets list)"
          if ! grep -Fq "RECIPE_SIGNING_PRIVATE_KEY_PEM" <<< "$secret_names"; then
            echo "::error::Provision RECIPE_SIGNING_PRIVATE_KEY_PEM directly in Supabase Edge Function Secrets before deployment."
            exit 1
          fi

      - name: Verify Auth email delivery provider secrets exist in Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          secret_names="$(supabase secrets list)"
          required_secrets=(
            RESEND_API_KEY
            RESEND_FROM_EMAIL
            BREVO_API_KEY
            BREVO_FROM_EMAIL
          )
          missing=()
          for secret_name in "${required_secrets[@]}"; do
            if ! grep -Fq "$secret_name" <<< "$secret_names"; then
              missing+=("$secret_name")
            fi
          done
          if (("${#missing[@]}" > 0)); then
            printf '::error::Missing Supabase email provider secret names: %s\n' "${missing[*]}"
            exit 1
          fi
          # SEND_EMAIL_HOOK_SECRET is generated later in the Supabase Auth Hook
          # dashboard. Do not require it until the hook is created.

      - name: Configure the exact Admin Panel origin in Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
        run: supabase secrets set "ADMIN_ORIGIN=$ADMIN_ORIGIN"

      - name: Preview pending database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --dry-run

      - name: Apply reviewed database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes

      - name: Deploy all 16 Edge Functions using their reviewed JWT policy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            admin-assign-tool
            admin-delete-draft-tool
            admin-disable-tool
            admin-invite-member
            admin-manage-device
            admin-manage-member
            admin-manage-tool-state
            admin-publish-tool
            admin-save-validation
            admin-upsert-tool
            get-admin-analytics
            get-my-repair-tools
            get-signed-repair-tool
            register-device
            submit-repair-run
            send-auth-email
          )
          for function in "${functions[@]}"; do
            echo "::group::Deploying $function"
            # send-auth-email has verify_jwt=false in supabase/config.toml and
            # validates the Standard Webhooks signature itself. The other 15
            # protected application functions retain verify_jwt=true.
            supabase functions deploy "$function" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done

      - name: Verify deployed migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked
